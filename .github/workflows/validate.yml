name: Validate and package WordPress extension
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax check
        run: find plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Standalone contract checks
        run: php tests/smoke.php
      - name: JavaScript syntax check
        run: node --check plugin/ramassedebris-service/assets/form.js
      - name: Browser form nonce and error-state tests
        run: node tests/form.test.cjs
      - name: Read-only inventory and security test script syntax
        run: bash -n scripts/wp-audit-readonly.sh scripts/wp-check-plugin-readonly.sh tests/run-manual-deletion.sh tests/run-request-handler.sh tests/run-wordpress-http.sh
      - name: Manual admin deletion security tests
        run: bash tests/run-manual-deletion.sh
      - name: Public request handler contract tests
        run: bash tests/run-request-handler.sh
      - name: Package isolated plugin
        run: |
          mkdir -p dist
          cd plugin
          zip -rq ../dist/ramassedebris-service.zip ramassedebris-service
      - uses: actions/upload-artifact@v4
        with:
          name: ramassedebris-wordpress-plugin
          path: dist/ramassedebris-service.zip
          retention-days: 14

  wordpress-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: rdb_ci
          MYSQL_USER: rdb_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
      - name: Install disposable WordPress and activate isolated plugin
        env:
          WP_ROOT: ${{ runner.temp }}/rdb-wordpress
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/wp-cli.phar" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php "$RUNNER_TEMP/wp-cli.phar" --info
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexec php "%s/wp-cli.phar" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin/wp"
          chmod +x "$RUNNER_TEMP/bin/wp"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          mkdir -p "$WP_ROOT"
          php "$RUNNER_TEMP/wp-cli.phar" core download --path="$WP_ROOT" --quiet
          php "$RUNNER_TEMP/wp-cli.phar" config create --path="$WP_ROOT" --dbname=rdb_ci --dbuser=rdb_ci --dbpass=ci-only-password --dbhost=127.0.0.1 --skip-check
          php "$RUNNER_TEMP/wp-cli.phar" core install --path="$WP_ROOT" --url=http://localhost --title="Ramasse CI" --admin_user=rdb_ci_admin --admin_password="Local-Only-CI-Pass-2048" --admin_email=admin@example.invalid --skip-email
          cp -R plugin/ramassedebris-service "$WP_ROOT/wp-content/plugins/"
          php "$RUNNER_TEMP/wp-cli.phar" plugin activate ramassedebris-service --path="$WP_ROOT"
      - name: Exercise roles, WordPress queries, privacy hooks and shortcode
        env:
          WP_ROOT: ${{ runner.temp }}/rdb-wordpress
        shell: bash
        run: |
          set -euo pipefail
          php "$RUNNER_TEMP/wp-cli.phar" eval-file "$GITHUB_WORKSPACE/tests/wordpress-integration.php" --path="$WP_ROOT"
          bash scripts/wp-check-plugin-readonly.sh "$WP_ROOT" 0.5.1
      - name: Real WordPress HTTP intake and nonce integration
        env:
          WP_ROOT: ${{ runner.temp }}/rdb-wordpress
        shell: bash
        run: bash tests/run-wordpress-http.sh
