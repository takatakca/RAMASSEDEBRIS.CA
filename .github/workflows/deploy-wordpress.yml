name: Deploy isolated WordPress plugin
on:
  workflow_run:
    workflows: ["Validate and package WordPress extension"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ramassedebris-wordpress-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && vars.RDB_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    environment: production
    env:
      RD_HOST: ${{ secrets.RDB_DEPLOY_HOST }}
      RD_PORT: ${{ secrets.RDB_DEPLOY_PORT }}
      RD_USER: ${{ secrets.RDB_DEPLOY_USER }}
      RD_PATH: ${{ secrets.RDB_DEPLOY_PLUGIN_PATH }}
      RD_KEY: ${{ secrets.RDB_DEPLOY_SSH_PRIVATE_KEY }}
      RD_KNOWN_HOSTS: ${{ secrets.RDB_DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate checked-out code before deployment
        shell: bash
        run: |
          set -euo pipefail
          find plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/smoke.php
          bash tests/run-manual-deletion.sh
          bash tests/run-request-handler.sh
          node --check plugin/ramassedebris-service/assets/form.js
          node tests/form.test.cjs
          bash -n scripts/wp-audit-readonly.sh
      - name: Reject deployment of an outdated commit
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$REMOTE"
          test "$CURRENT" = "$REMOTE"
      - name: Check SSH deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RD_HOST" && test -n "$RD_USER" && test -n "$RD_PATH" && test -n "$RD_KEY" && test -n "$RD_KNOWN_HOSTS"
          [[ "$RD_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RD_USER" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$RD_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
          [[ "${RD_PORT:-22}" =~ ^[0-9]+$ ]]
          [[ "$RD_PATH" == */wp-content/plugins/ramassedebris-service ]]
          [[ "$RD_PATH" != *".."* ]]
          (( 10#${RD_PORT:-22} >= 1 && 10#${RD_PORT:-22} <= 65535 ))
      - name: Configure strict SSH verification
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$RD_KEY" > ~/.ssh/rd_deploy
          printf '%s\n' "$RD_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload only the plugin directory
        shell: bash
        run: |
          set -euo pipefail
          PORT="${RD_PORT:-22}"
          ssh -i ~/.ssh/rd_deploy -p "$PORT" -o StrictHostKeyChecking=yes "$RD_USER@$RD_HOST" "mkdir -p '$RD_PATH'"
          rsync -az --no-owner --no-group --no-perms -e "ssh -i $HOME/.ssh/rd_deploy -p $PORT -o StrictHostKeyChecking=yes" plugin/ramassedebris-service/ "$RD_USER@$RD_HOST:$RD_PATH/"
      - name: Verify transferred plugin checksum
        shell: bash
        run: |
          set -euo pipefail
          PORT="${RD_PORT:-22}"
          for FILE in ramassedebris-service.php assets/form.css assets/form.js; do
            LOCAL_SHA="$(sha256sum "plugin/ramassedebris-service/$FILE" | awk '{print $1}')"
            REMOTE_SHA="$(ssh -i ~/.ssh/rd_deploy -p "$PORT" -o StrictHostKeyChecking=yes "$RD_USER@$RD_HOST" "sha256sum '$RD_PATH/$FILE'" | awk '{print $1}')"
            test -n "$REMOTE_SHA"
            test "$LOCAL_SHA" = "$REMOTE_SHA"
          done
          echo "Remote plugin PHP, CSS and JS checksums verified."
      - name: Deployment information
        run: echo "Plugin PHP, CSS and JavaScript files transferred and checksummed. WordPress activation and end-to-end tests remain explicit release gates."
